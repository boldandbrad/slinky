on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

name: "Shellcheck"
permissions: {}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: pollenjp/setup-shellcheck@v1
        with:
          version: latest
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck slinky
